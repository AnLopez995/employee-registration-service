spring.application.name=employee-soap-service
server.port=8081

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/workforce?connectionTimeZone=America/Bogota
spring.datasource.username=${DB_USER:parameta}
spring.datasource.password=${DB_PASSWORD:parameta}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true